server:
  port: 30000
  mode: debug # debug, release, test
  host: "0.0.0.0"
  shutdown_timeout: 30  # 优雅关闭超时时间(秒)
  read_timeout: 30      # 读取超时时间(秒)
  write_timeout: 30     # 写入超时时间(秒)

client:
  server_url: "http://localhost:30000"  # 服务器地址
  timeout: 30                           # 请求超时时间(秒)
  retry_count: 3                        # 重试次数
  retry_delay: 1                        # 重试延迟(秒)
  output_format: "json"                 # 输出格式: json, yaml, table

# database:
#   host: "localhost"
