# 生产环境配置
server:
  host: "0.0.0.0"
  port: "80"
  mode: "release"

app:
  name: "learngo0619"
  version: "1.0.0"

log:
  level: "info"           # 生产环境使用info级别
  format: "json"          # JSON格式便于日志分析
  output: "file"          # 仅输出到文件
  dir: "logs"
  max_size: 100           # 100MB
  max_age: 30             # 30天
  max_backups: 10
  compress: true          # 压缩归档 