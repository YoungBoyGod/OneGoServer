# 开发环境配置
server:
  host: "0.0.0.0"
  port: "8080" 
  mode: "debug"

app:
  name: "learngo0619-dev"
  version: "1.0.0-dev"

log:
  level: "debug"          # 开发环境使用debug级别
  format: "console"       # 控制台格式便于调试
  output: "both"          # 同时输出到控制台和文件
  dir: "logs"
  max_size: 50            # 50MB
  max_age: 7              # 7天
  max_backups: 3
  compress: false 