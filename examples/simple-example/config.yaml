# 这是一个简单的YAML配置文件示例
# YAML 语法规则：
# 1. 使用缩进表示层级关系（不要使用Tab，只用空格）
# 2. 冒号后面要有空格
# 3. # 表示注释

# 服务器配置
server:
  port: "8080"    # 服务器监听端口（必须用引号，因为在Go中定义为string类型）
  mode: "debug"   # 运行模式：debug（调试模式）或 release（发布模式）

# 应用配置
app:
  name: "我的第一个Web应用"      # 应用名称
  version: "1.0.0"             # 应用版本

# 注释：
# - server 和 app 是两个顶级配置块
# - port、mode、name、version 是具体的配置项
# - 字符串值建议用引号包围，避免解析错误
# - 修改这个文件后，重启程序即可看到效果 