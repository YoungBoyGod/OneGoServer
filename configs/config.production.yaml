# OneGoServer 生产环境配置覆盖
server:
  mode: "release"
  port: "8080"

# 生产环境数据库（使用环境变量）
database:
  host: "${DB_HOST}"
  port: 5432
  username: "${DB_USERNAME}"
  password: "${DB_PASSWORD}"
  dbname: "${DB_NAME}"
  max_idle_conns: 20
  max_open_conns: 200
  auto_migrate: false  # 生产环境手动迁移

# 生产环境Redis
redis:
  host: "${REDIS_HOST}"
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0
  pool_size: 20
  min_idle_conns: 10

# 生产环境Kafka
kafka:
  brokers: ["${KAFKA_BROKER_1}", "${KAFKA_BROKER_2}", "${KAFKA_BROKER_3}"]
  producer:
    retry_max: 5
  consumer:
    group_id: "onego-server-prod"

# 生产环境日志
logging:
  level: "info"
  output: "file"
  file_path: "/var/log/onego/app_{timestamp}.log"
  max_size: 500   # MB
  max_backups: 30
  max_age: 90     # days

# 生产环境安全配置（严格）
security:
  cors:
    allow_origins: ["https://yourdomain.com"]
  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst: 20

# 生产环境JWT
jwt:
  secret: "${JWT_SECRET}"
  expire_hours: 24
  refresh_expire_hours: 168

# 生产环境业务配置
business:
  user:
    max_login_attempts: 3
    account_lockout_duration: 600  # 10分钟
  task:
    max_retry_count: 5
  device:
    heartbeat_interval: 60  # 1分钟
    offline_timeout: 600    # 10分钟 